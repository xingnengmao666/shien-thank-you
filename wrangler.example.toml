name = "shien-thank-you"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "shien-thank-you-db"
database_id = "replace-with-your-d1-database-id"
migrations_dir = "migrations"

[triggers]
crons = ["15 19 * * *"]

[observability.issues]
enabled = true
